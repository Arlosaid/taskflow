services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_password
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow_dev_password@db:5432/taskflow
      APP_ENV: docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
