name: oidc-smoke-test

# Manual only. This workflow is throwaway — delete it once it passes.
on: workflow_dispatch

permissions:
  contents: read
  id-token: write        # REQUIRED. Without it GitHub issues no OIDC token at all.

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654740195516:role/taskflow-dev-github-deploy
          aws-region: us-east-1

      - run: aws sts get-caller-identity
